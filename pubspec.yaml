name: vade
description: "Track warranties, subscriptions, and expiration dates with smart reminders."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  auto_route: ^11.1.0
  easy_localization: ^3.0.8
  provider: ^6.1.5+1
  get_it: ^9.2.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  auto_route_generator: ^10.6.0

flutter:
  uses-material-design: true

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/urbanist/Urbanist-Variable.ttf
        - asset: assets/fonts/urbanist/Urbanist-Italic-Variable.ttf
          style: italic

  assets:
    - assets/translations/
    - assets/images/icons_nav/
    - assets/images/icons_other/
    - assets/images/icons_slim/
    - assets/images/icons_category/
